# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Evals del Manager Agent de Parachute S.A. (FAQs + clima/citas)"

prompts:
  - "{{inquiry}}"

providers:
  - id: "file://provider.py"

defaultTest:
  options:
    # Umbral de latencia por defecto en ms; cada test puede sobreescribirlo.
    maxLatencyMs: 15000

tests:
  # Ejemplo FAQ: Persona B agregará sus casos en faq_tests.yaml
  - vars:
      inquiry: "¿Cuál es el precio de un salto en tándem?"
    assert:
      - type: latency
        threshold: 15000
      - type: python
        value: "'search_faq' in context['metadata']['tool_names']"

  # Ejemplo clima/citas: Persona C agregará sus casos en citas_tests.yaml
  - vars:
      inquiry: "¿El próximo sábado es buen día para saltar?"
    assert:
      - type: latency
        threshold: 15000
      - type: python
        value: "'check_weather' in context['metadata']['tool_names']"
