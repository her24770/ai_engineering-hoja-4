services:
  db:
    image: pgvector/pgvector:pg16
    container_name: parachute-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parachute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parachute}
      POSTGRES_DB: ${POSTGRES_DB:-parachute_faqs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-parachute} -d $${POSTGRES_DB:-parachute_faqs}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
